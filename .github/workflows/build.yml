name: Build XCC

on:
  push:
    branches: [ "master" ]
    paths:
      - '**.cc'
      - '**.h'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**.cc'
      - '**.h'
  workflow_dispatch:
    inputs:
      features:
        description: "Space-separated list of key-value feature toggles"
        required: false
      verbose_build:
          description: "Verbose build logs"
          required: false
      omit_tests:
        description: "Omit tests"
        required: false
      tests_verbose:
        description: "Run testrunner with verbose flag"
        required: false
      tests_print_output:
        description: "Run testrunner with print output (stdout/stderr) flag"
        required: false

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Prevent other builds from cancelling if one OS fails
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            cc: clang-21
            cxx: clang++-21
            llvm_dir: /usr/lib/llvm-21/lib/cmake/

          - os: macos-15-intel
            name: macos-intel
            cc: clang
            cxx: clang++
            llvm_dir: /opt/local/libexec/llvm-21/lib/cmake/llvm

          - os: macos-latest
            name: macos-arm64
            cc: clang
            cxx: clang++
            llvm_dir: /opt/homebrew/opt/llvm@21/lib/cmake/llvm

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: matrix.name == 'linux'
      run: |
        sudo apt update
        sudo apt install -y python3 cmake make wget lsb-release software-properties-common gnupg zlib1g-dev libzstd-dev libdwarf-dev
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 21 all

    - name: Install Dependencies (macOS ARM64 - Homebrew)
      if: matrix.name == 'macos-arm64'
      run: |
        brew install cmake make zstd llvm@21 || true

    - name: Cache MacPorts (macOS Intel)
      if: matrix.name == 'macos-intel'
      id: cache-macports
      uses: actions/cache@v4
      with:
        path: /opt/local
        key: ${{ runner.os }}-macports-llvm21

    - name: Install Dependencies (macOS Intel - MacPorts)
      if: matrix.name == 'macos-intel' && steps.cache-macports.outputs.cache-hit != 'true'
      uses: melusina-org/setup-macports@v1

    - name: Fetch MacPorts Packages (macOS Intel)
      if: matrix.name == 'macos-intel' && steps.cache-macports.outputs.cache-hit != 'true'
      run: sudo port install cmake gmake zstd llvm-21

    - name: Configure
      run: |
        ARGS=""

        if [ -n "${{ inputs.features }}" ]; then
          for feature in ${{ inputs.features }}
          do
            ARGS="$ARGS -D$feature"
          done
        fi

        if [ -n "${{ inputs.verbose_build }}" ]; then
          ARGS="$ARGS -DVERBOSE=1"
        fi
        
        cmake -B build -S . -G "Unix Makefiles" $ARGS
      env:
        CC: ${{ matrix.cc }}
        CXX: ${{ matrix.cxx }}
        LLVM_DIR: ${{ matrix.llvm_dir }}

    - name: Build
      run: cmake --build build --target xcc --parallel

    - name: Run tests
      run: |
        ARGS=""

        if [ -n "${{ inputs.tests_verbose }}" ]; then
          ARGS="$ARGS -v"
        fi

        if [ -n "${{ inputs.tests_print_output }}" ]; then
          ARGS="$ARGS -p"
        fi

        if [ -z "${{ inputs.omit_tests }}" ]; then
          python3 tests/testrun.py -c tests/tests.json -e build/xcc -l lib/stdc $ARGS
        else
          echo "Omit tests"
        fi

    - name: Archive executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: xcc-${{ matrix.name }}
        path: build/xcc
